name: Sync to HuggingFace Space

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync to HuggingFace Space
        uses: huggingface/hub-sync@main
        with:
          repo_id: Vishu54645/opticsverse-3d
          repo_type: space
          token: ${{ secrets.HF_TOKEN }}
